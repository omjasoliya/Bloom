# Builds the Bloom installers on GitHub's machines:
#   Windows  dist/Bloom-Setup.exe
#   Linux    dist/bloom_<version>_amd64.deb and _arm64.deb  (built on Ubuntu 22.04, so they run on 22.04 and newer)
#   Android  dist/Bloom.apk  (signed with the BLOOM_KEYSTORE_B64 / BLOOM_KEYSTORE_PASSWORD secrets)
# Run it from Actions -> Build -> Run workflow and download the files from the run's Artifacts.
# Pushing a tag like v0.2.0 also publishes both files as a GitHub Release.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup if missing
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: cmd
        run: packaging\build_windows.bat
      - name: Smoke test the engine
        shell: cmd
        run: .venv-win\Scripts\python -c "import bloom.converters, bloom.tools, bloom.platform_utils as pu; print('desktop:', pu.desktop_dir()); print('ffmpeg:', pu.ffmpeg_exe())"
      - uses: actions/upload-artifact@v4
        with:
          name: Bloom-Windows
          path: dist/Bloom-Setup.exe

  linux:
    strategy:
      fail-fast: false          # a failure on one architecture shouldn't hide the other's result
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: ./packaging/build_linux.sh
      - name: Install the .deb and launch Bloom
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ./dist/bloom_*_${{ matrix.arch }}.deb
          export HOME=$(mktemp -d)
          status=0
          xvfb-run -a timeout 10 bloom || status=$?
          test "$status" = 124      # still running after 10 s means it started fine
      - uses: actions/upload-artifact@v4
        with:
          name: Bloom-Linux-${{ matrix.arch }}
          path: dist/*.deb

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.BLOOM_KEYSTORE_B64 }}
          BLOOM_KEYSTORE_PASSWORD: ${{ secrets.BLOOM_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bloom.p12"
            export BLOOM_KEYSTORE="$RUNNER_TEMP/bloom.p12"
          fi
          gradle --no-daemon assembleDebug assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release*.apk ../dist/Bloom.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/aapt2" dump permissions ../dist/Bloom.apk
          "$tools/apksigner" verify --print-certs ../dist/Bloom.apk || echo "(unsigned)"
          ls -la ../dist
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Try it on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash android/ci/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-screenshots
          path: android-shots/
      - uses: actions/upload-artifact@v4
        with:
          name: Bloom-Android
          path: dist/Bloom.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # A fixed name too, so the website can always link to .../releases/latest/download/bloom_amd64.deb
      - run: |
          cp bloom_*_amd64.deb bloom_amd64.deb
          cp bloom_*_arm64.deb bloom_arm64.deb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Bloom-Setup.exe
            Bloom.apk
            bloom_*.deb
